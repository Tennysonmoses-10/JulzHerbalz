services:
  - type: web
    name: julz-herbals
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXTAUTH_SECRET
        value: julz-herbals-secret-key-2026-render-secure
