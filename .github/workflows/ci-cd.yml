name: Julz Herbals CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Type Checker
        run: npx tsc --noEmit

      - name: Run ESLint Verification
        run: npm run lint --if-present

      - name: Run Security Audit
        run: npm audit --audit-level=high

      - name: Build Next.js Web App
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/julz_herbals?schema=public"
          NEXTAUTH_SECRET: "ci-cd-test-secret-julz-herbals-2026"
          NEXTAUTH_URL: "http://localhost:3000"
